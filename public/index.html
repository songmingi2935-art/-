<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>노네임</title><link rel="stylesheet" href="/style.css"></head><body><header><h1>노네임</h1><p>내가 가진 포켓몬을 한눈에 정리하는 공간</p><button id="loginBtn">관리자 로그인</button><button id="logoutBtn" hidden>로그아웃</button></header><main><section class="tools"><input id="search" placeholder="포켓몬 이름 검색"><select id="typeFilter"><option value="">전체 타입</option></select><button id="addBtn" hidden>＋ 포켓몬 추가</button></section><div id="grid"></div></main><dialog id="loginDlg"><form method="dialog"><h2>관리자 로그인</h2><input id="password" type="password" placeholder="관리자 비밀번호"><div><button value="cancel">취소</button><button id="doLogin" value="default">로그인</button></div></form></dialog><dialog id="editDlg"><form method="dialog"><h2 id="dlgTitle">포켓몬 추가</h2><input id="name" placeholder="포켓몬 이름" required><input id="cp" type="number" placeholder="CP"><input id="iv" placeholder="IV (예: 98%)"><input id="type" placeholder="타입"><textarea id="note" placeholder="메모"></textarea><input id="image" type="file" accept="image/*"><img id="preview"><div><button value="cancel">취소</button><button id="saveBtn" value="default">저장</button></div></form></dialog><script src="/app.js"></script></body></html>
