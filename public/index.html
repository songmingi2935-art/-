<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>노네임</title><link rel="stylesheet" href="/style.css"></head><body><header><h1><span class="pokeball"></span> 목록 <span class="pokeball"></span></h1><p class="header-links"><a id="contactLink" class="contact-button" href="https://open.kakao.com/o/sIKHUmXi" target="_blank" rel="noopener noreferrer">⭐ 문의하기 ⭐</a><button type="button" id="noticeBtn">⭐ 필수확인 ⭐</button></p><button id="loginBtn">관리자 로그인</button><button id="logoutBtn" hidden>로그아웃</button></header><main><section class="tools"><input id="search" placeholder="포켓몬 이름 검색"><select id="typeFilter"><option value="">전체 타입</option></select><button id="addBtn" hidden>＋ 포켓몬 추가</button></section><div id="grid"></div></main><dialog id="loginDlg"><form method="dialog"><h2>관리자 로그인</h2><input id="password" type="password" placeholder="관리자 비밀번호"><div><button type="button" id="loginCancel">취소</button><button id="doLogin" value="default">로그인</button></div></form></dialog><dialog id="editDlg"><form method="dialog"><h2 id="dlgTitle">포켓몬 추가</h2><input id="name" placeholder="포켓몬 이름" required><input id="level" type="number" min="1" placeholder="Lv."><input id="price" type="number" min="0" placeholder="가격"><input id="type" placeholder="타입"><textarea id="note" placeholder="메모"></textarea><input id="image" type="file" accept="image/*" multiple><div id="preview"></div><div><button type="button" id="editCancel">취소</button><button id="saveBtn" value="default">저장</button></div></form></dialog><dialog id="detailDlg"><div id="detail"></div><button type="button" id="detailClose">닫기</button></dialog><dialog id="noticeDlg"><div class="notice-box"><h2>⭐ 필수확인 ⭐</h2><textarea id="noticeEdit" placeholder="공지사항이나 주의사항을 자유롭게 작성하세요."></textarea><button type="button" id="noticeSave">저장</button><div id="noticeView"></div></div><button type="button" id="noticeClose">닫기</button></dialog><dialog id="photoDlg"><img id="photoView" alt=""><button type="button" id="photoClose">닫기</button></dialog><script src="/app.js"></script></body></html>
