databases:
  - name: noname-db
    plan: free
    region: singapore
    databaseName: noname_db
    user: noname_db_user

services:
  - type: web
    name: noname
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noname-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
