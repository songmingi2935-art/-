databases:
  - name: noname-db
    plan: free
    region: singapore
    postgresMajorVersion: 18

services:
  - type: web
    name: noname
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noname-db
          property: connectionString
