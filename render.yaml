databases:
  - name: mingi-pokemon-db
    plan: free
    region: singapore
    databaseName: mingi_pokemon_db
    user: mingi_pokemon_db_user
services:
  - type: web
    name: mingi-pokemon
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mingi-pokemon-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
